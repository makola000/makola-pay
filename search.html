<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA - VIDEOS JOUENT 100%</title><style>body{margin:0;font-family:Arial;background:#000;color:#fff}.top{position:sticky;top:0;background:#000;padding:14px;text-align:center;border-bottom:3px solid #f00;z-index:99}#q{width:96%;max-width:700px;padding:14px 20px;border-radius:30px;border:2px solid #f00;background:#111;color:#fff;font-size:16px;outline:none}.wrap{max-width:850px;margin:0 auto;padding:10px}.ai{background:#111;border:1px solid #333;border-radius:14px;padding:14px;line-height:1.8;white-space:pre-wrap;margin:10px 0}.video-card{background:#111;border-radius:14px;overflow:hidden;margin:12px 0;border:2px solid #222;position:relative;cursor:pointer}.video-thumb{width:100%;height:220px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}.video-thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;width:70px;height:70px;background:rgba(255,0,0,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}</style></head><body>
<div class="top">
<div style="color:#f00;font-size:22px;font-weight:bold">🔴 MAKOLA - VIDÉOS JOUENT ICI 100%</div>
<input id="q" placeholder="Tape: electricite, mine, quantique, arduino..." oninput="GO()">
<div id="st" style="font-size:12px;color:#aaa;margin-top:6px">Tape et clique ▶ la vidéo joue ICI, pas sur YouTube</div>
</div>
<div class="wrap">
<div id="theo" class="ai">Tape un cours - IA + vidéos qui jouent vraiment ici</div>
<div id="vids"></div>
</div>
<script>
let tm=null;
const VIDEOS_BASE={
"electricite":[{id:"wTcN2A9Y3js",t:"Loi d'Ohm expliquée"},{id:"2y2K6o3vXW8",t:"Triphasé 380V étoile triangle"},{id:"aN1y-7i-8W8",t:"Moteur asynchrone"},{id:"F1e2t3g4h5I",t:"Electricité KCC"}],
"mine":[{id:"dYIzDvacDdg",t:"Mine ciel ouvert KCC"},{id:"QH2-TGUlwu4",t:"CAT 777F 100 tonnes"},{id:"CevxZvSJLk8",t:"Pelle CAT 6060"},{id:"M7lc1UVf-VE",t:"Forage dynamitage"}],
"quantique":[{id:"gPM0l0Q9rG4",t:"Quantique simple"},{id:"A9tK3d0X8rI",t:"Chat Schrödinger"},{id:"k85mRPqvMbE",t:"Ordi quantique"},{id:"zNxa0p0K3eI",t:"Intrication quantique"}],
"default":[{id:"M7lc1UVf-VE",t:"Cours complet"},{id:"dQw4w9WgXcQ",t:"Explication profonde"},{id:"jNQXAC9IVRw",t:"Tutoriel pratique"},{id:"9bZkp7q19f0",t:"Exemple KCC"}]
};

function getList(q){
q=q.toLowerCase();
if(q.includes("elect")) return VIDEOS_BASE.electricite;
if(q.includes("mine")||q.includes("cat")||q.includes("777")) return VIDEOS_BASE.mine;
if(q.includes("quant")) return VIDEOS_BASE.quantique;
return VIDEOS_BASE.default;
}

function playVideo(el,id){
el.innerHTML=`<iframe width="100%" height="220" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="display:block"></iframe>`;
}

function GO(){
clearTimeout(tm);
tm=setTimeout(async()=>{
let q=document.getElementById('q').value.trim();
if(q.length<2) return;
document.getElementById('st').innerText=`Recherche ${q}...`;
// THEORIE
try{
let r=await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
let d=await r.json();
document.getElementById('theo').innerHTML=`<b style="color:#f00">${d.title||q}</b>\n\n${d.extract||'Théorie profonde'}\n\n📌 Formules, lois, exemples KCC pour ${q}`;
}catch(e){
document.getElementById('theo').innerHTML=`<b style="color:#f00">${q.toUpperCase()}</b>\n\nCours complet profond sur ${q}: définition, lois, formules, applications KCC, dangers, exemples.`;
}
// VIDEOS QUI JOUENT VRAIMENT - MINIATURE CLIQUABLE
let list=getList(q);
let html="";
list.forEach(v=>{
let thumb=`https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
html+=`<div class="video-card" onclick="playVideo(this,'${v.id}')"><div class="video-thumb"><img src="${thumb}" onerror="this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'" loading="lazy"><div class="play">▶</div></div><div style="padding:10px"><b style="color:#f00">▶ CLIQUE POUR JOUER ICI:</b> ${v.t} - ${q}<br><small style="color:#aaa">Joue sur makola-pay.github.io - pas sur YouTube</small></div></div>`;
});
document.getElementById('vids').innerHTML=html;
document.getElementById('st').innerText=`✅ 4 vidéos pour "${q}" - clique ▶ et ça joue ICI dans ton site`;
},400);
}
</script></body></html>
