<script>

function setTab(t,el){ document.querySelectorAll('.tabs span').forEach(s=>s.classList.remove('active')); el.classList.add('active'); doSearch(); }

async function getWiki(q){
 try{
  let s=await fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&format=json&origin=*&srlimit=1');
  let sj=await s.json(); if(!sj.query.search.length) return null;
  let title=sj.query.search[0].title;
  let c=await fetch('https://fr.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages|info&titles='+encodeURIComponent(title)+'&explaintext=1&exchars=4000&pithumbsize=200&inprop=url&format=json&origin=*');
  let cj=await c.json(); let p=Object.values(cj.query.pages)[0];
  return {title:p.title, extract:p.extract, url:p.fullurl, thumb:p.thumbnail?p.thumbnail.source:'', snippet:sj.query.search[0].snippet};
 }catch(e){ return null; }
}

function togglePAA(el){
 let a=el.nextElementSibling; a.classList.toggle('open'); el.querySelector('span:last-child').innerText=a.classList.contains('open')?'▲':'▼';
}

async function doSearch(){
 let q=document.getElementById('q').value.trim(); if(!q) return;
 currentQ=q; page=0;
 document.getElementById('status').innerHTML='🔍 Recherche <b>'+q+'</b> - Théories bien faites comme Google + vidéos sur site...';
 document.getElementById('results').innerHTML='⏳ Chargement Google complet...';
 document.getElementById('bigPlayer').style.display='none';
 document.getElementById('related').style.display='none';

 wikiData=await getWiki(q);

 let html='';

 // 1. KNOWLEDGE PANEL comme Google à droite - Théorie bien faite
 if(wikiData){
  html+='<div class="knowledge"><img src="'+(wikiData.thumb||'https://upload.wikimedia.org/wikipedia/commons/8/80/Wikipedia-logo-v2.svg')+'" onerror="this.src=\'https://upload.wikimedia.org/wikipedia/commons/8/80/Wikipedia-logo-v2.svg\'"><div class="info"><div class="title">'+wikiData.title+'</div><div class="sub">Capteur de température • Wikipédia</div><div class="desc">'+wikiData.extract.substring(0,260)+'...</div><div style="margin-top:8px"><a href="'+wikiData.url+'" target="_blank" style="color:#1a0dab;font-size:12px">Wikipédia</a><button class="audioBtn" onclick="speak()">🔊 Écouter</button></div></div></div>';
 }

 // 2. FORMULE comme Google (si PT100)
 if(q.toLowerCase().includes('pt100')){
  html+='<div class="res"><div class="url"><img src="https://www.wikipedia.org/static/favicon/wikipedia.ico"> fr.wikipedia.org › wiki › Sonde PT100</div><a class="title">PT100 - Formule exacte et théorie profonde</a><div class="formulaGoogle"><div class="label">Formule exacte - Équation Callendar-Van Dusen (comme Google affiche formule)</div><div class="eq">R(T) = R₀ × [1 + A·T + B·T² + C·(T-100)·T³]<br>R₀=100Ω à 0°C, A=3,9083×10⁻³/°C, B=-5,775×10⁻⁷/°C², C=-4,183×10⁻¹²/°C⁴<br><br>Simplifié terrain Kolwezi: R ≈ 100 + 0,385×T<br>Exemples: 0°C=100Ω, 26°C=110,03Ω, 50°C=119,40Ω, 100°C=138,50Ω</div></div><div class="snippet">Le <b>PT100</b> est un capteur à résistance de platine de <b>100Ω à 0°C</b>. Norme <b>IEC 60751</b>, plage <b>-200°C à +850°C</b>, précision <b>classe AA ±0,1°C</b>. Principe: résistance platine augmente avec température (0,385Ω/°C). Types: <b>2 fils</b> (erreur câble), <b>3 fils</b> (compensation industriel), <b>4 fils</b> (Kelvin labo ±0,01°C).</div></div>';
 }

 // 3. VIDÉOS QUI JOUENT SUR TON SITE - Comme Google vidéos mais jouent sur makola.com
 html+='<div class="vSection"><div style="font-size:16px;margin-bottom:8px">🎬 Vidéos pour '+q+' - Cliquez → joue SUR makola.com (pas YouTube)</div><div class="vGrid">';
 let vids=[{id:'NFJ1F6yyqR0',t:q+' - Théorie exacte profonde - Cours complet',meta:'YouTube · 15:23'},{id:'S1aTf52wz9U',t:q+' - Pratique terrain Kolwezi - Prix 30$',meta:'MAKOLA · 8:42'},{id:'hhL4m7ca3tM',t:q+' - Tutoriel débutant à expert Harvard',meta:'Formation · 22:10'}];

 });
 html+='</div><div style="font-size:11px;color:#70757a">💡 Miniatures d\'abord (pas iframe) → pas détecté bot → clique → 1 lecteur joue SUR ton site avec son humain</div></div>';

 // 4. RÉSULTATS GOOGLE-STYLE - Théories bien faites

  html+='<div class="res"><div class="url"><img src="https://www.wikipedia.org/static/favicon/wikipedia.ico"> '+wikiData.url.replace('https://','')+'</div><a class="title" href="'+wikiData.url+'" target="_blank">'+wikiData.title+' — Wikipédia</a><div class="snippet">'+wikiData.extract.substring(0,320)+'...</div></div>';
 }

 // 5. PEOPLE ALSO ASK comme Google
 html+='<div class="paa"><div class="paaTitle">Autres questions posées</div>';

 paa.forEach(item=>{

 });

 document.getElementById('results').innerHTML=html;
 document.getElementById('btnMore').style.display='block';
 document.getElementById('btnMore').innerText='▼ Afficher plus - Encore théorie + vidéos + recherches associées';

 // 6. RECHERCHES ASSOCIÉES comme Google en bas
 let rel=generateRelated(q);
 let relHtml='<div class="relTitle">Recherches associées</div><div class="relGrid">';
 rel.forEach(r=>{
  relHtml+='<div class="relItem" onclick="document.getElementById(\'q\').value=\''+r.replace(/'/g,'\\\'')+'\'; doSearch();"><img src="https://www.google.com/favicon.ico"> '+r+'</div>';
 });
 relHtml+='</div>';
 document.getElementById('related').innerHTML=relHtml;
 document.getElementById('related').style.display='block';

 document.getElementById('status').innerHTML='✅ '+q+' - Google complet sur makola.com - Théorie bien faite + vidéos sur site + People also ask + recherches associées - Plus besoin autre site';
}

function generateRelated(q){
 let base=q.toLowerCase();
 if(base.includes('pt100')) return ['PT100 3 fils branchement','PT100 formule calcul','PT100 prix Kolwezi','capteur température industriel','PT100 vs thermocouple','test PT100 multimètre','PT100 classe A B','sonde PT100 WIKA'];

 return [q+' formule exacte',q+' cours complet',q+' pratique Kolwezi',q+' prix marché',q+' définition Wikipédia',q+' tutoriel vidéo',q+' Harvard université',q+' business Kolwezi'];
}

async function loadMore(){

  html+='<div class="vSection"><div style="font-weight:bold">🎬 Plus de vidéos '+currentQ+' - Page 2 - Jouent sur site</div><div class="vGrid"><div class="vCard" onclick="playVideo(\'dQw4w9WgXcQ\',\''+currentQ+' Harvard\')"><img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg"><div class="play">▶</div><div class="vInfo"><div class="vTitle">'+currentQ+' - Cours Harvard</div><div class="vMeta">Université · 45:20</div></div></div><div class="vCard" onclick="playVideo(\'jNQXAC9IVRw\',\''+currentQ+' simple\')"><img src="https://img.youtube.com/vi/jNQXAC9IVRw/hqdefault.jpg"><div class="play">▶</div><div class="vInfo"><div class="vTitle">'+currentQ+' - Simple primaire</div><div class="vMeta">École · 5:12</div></div></div><div class="vCard" onclick="playVideo(\'NFJ1F6yyqR0\',\''+currentQ+' expert\')"><img src="https://img.youtube.com/vi/NFJ1F6yyqR0/hqdefault.jpg"><div class="play">▶</div><div class="vInfo"><div class="vTitle">'+currentQ+' - Expert mine</div><div class="vMeta">Pro · 18:30</div></div></div></div></div>';
 } else if(page===2){
  html+='<div class="res"><div class="url">makola.com › univers › '+currentQ+'</div><a class="title" style="color:#00a651">'+currentQ+' - Tout l\'univers - Électronique, méca, maths, Bible, mine - MAKOLA</a><div class="snippet">MAKOLA Universal: <b>Électronique</b> transistor, <b>Électricité</b> triphasé, <b>Méca</b> engrenage, <b>Auto</b> moteur 4 temps, <b>Santé</b> palu, <b>Maths Harvard</b> dérivée intégrale, <b>Bible/Coran/Torah</b>, <b>Mine</b> ciel ouvert souterraine, <b>Construction</b> béton 350kg/m3, <b>Info</b> réseau IP, <b>IA</b> ChatGPT. Même ce que tu n\'as pas cité est dedans.</div></div>';
 }

 document.getElementById('results').innerHTML+=html;
 document.getElementById('btnMore').innerText='▼ Afficher encore plus - Page '+(page+2)+' (déjà '+(page+1)+' pages)';
 if(page>=2){ document.getElementById('btnMore').innerText='✅ Tout affiché - Google complet sur ton site'; document.getElementById('btnMore').disabled=true; }
}

doSearch();
</script>
