<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA AI - Vidéos Théories Profondes</title><style>body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff}.h{background:linear-gradient(90deg,#00a651,#ff6f00);color:#fff;padding:10px;text-align:center;font-weight:bold;position:sticky;top:0;z-index:100}.logo{font-size:58px;text-align:center;margin:15px 0 5px;font-weight:bold;letter-spacing:-4px}.logo b{color:#00a651}.logo o{color:#ff6f00}.s{width:94%;max-width:760px;margin:10px auto;background:#fff;border:3px solid #00a651;border-radius:28px;display:flex;align-items:center;padding:5px 18px}.s input{flex:1;border:0;outline:none;font-size:15px;padding:12px;color:#000}.btn{background:linear-gradient(90deg,#00a651,#ff6f00);color:#fff;border:0;padding:11px 16px;border-radius:24px;font-weight:bold;cursor:pointer}.res{max-width:820px;margin:14px auto;padding:0 12px}.theory{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.ai{background:#fff;color:#000;border:2px solid #00a651;border-radius:16px;padding:16px;margin:10px 0;white-space:pre-wrap;line-height:1.6;font-size:14px}canvas{width:100%;border-radius:12px;border:2px solid #00a651;background:#000}video{width:100%;border-radius:12px;background:#000;margin:8px 0;border:2px solid #00a651}.vbox{background:#1a1a1a;border:2px solid #00a651;border-radius:14px;padding:12px;margin:12px 0}</style></head><body>

<div class="h">🎬 MAKOLA AI - VIDÉOS THÉORIES PROFONDES - Qui parlent vraiment de ta recherche</div>
<div class="logo"><b>MAK</b><o>O</o><b>LA</b> AI 🎓</div>
<div style="text-align:center;margin:5px 0;color:#00ff88;font-size:12px;font-weight:bold">VIDÉOS GÉNÉRÉES AUTOMATIQUEMENT QUI EXPLIQUENT LA THÉORIE COMPLÈTE</div>

<div class="s"><span style="font-size:20px">🎓</span><input id="q" placeholder="Tape: electricite, moteur, paludisme, soudure, bitcoin..." autofocus onkeypress="if(event.key==='Enter')start()"><button class="btn" onclick="start()">Générer Cours Vidéo</button></div>

<div class="res">
<div id="st" style="text-align:center;color:#888;font-size:12px">Tape ta recherche → MAKOLA génère 3 vidéos théories profondes qui parlent vraiment</div>
<div id="ai"></div>
<canvas id="canvas" width="1280" height="720" style="display:none"></canvas>
<div id="videos"></div>
</div>

<script>
let voices=[];
speechSynthesis.getVoices();
setTimeout(()=>{voices=speechSynthesis.getVoices();},500);

function speak(text, onEnd){
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(text);
 u.lang='fr-FR';
 u.rate=0.92;
 let fv=voices.find(v=>v.lang.includes('fr'));
 if(fv) u.voice=fv;
 u.onend=onEnd||(()=>{});
 speechSynthesis.speak(u);
}

function getTheory(sujet){
 let S=sujet.toUpperCase();
 return {
  definition: `DÉFINITION DE ${S}: ${S} est un concept fondamental. Pour bien comprendre, il faut savoir que ${S} fonctionne selon des lois physiques précises. A Kolwezi, ${S} est utilisé chaque jour à la mine KCC et dans les maisons. Sans ${S}, pas de développement.`,
  fonctionnement: `FONCTIONNEMENT DE ${S}: ${S} fonctionne avec 3 principes. Principe 1: énergie ou matière transformée. Principe 2: composants qui travaillent ensemble. Principe 3: contrôle et sécurité. Exemple concret: si tu prends ${S} de 1000 Watts, il consomme 1kWh par heure, donc 24kWh par jour. A Kolwezi, SNEL facture 0.15$ le kWh, donc ça coûte 3.6$ par jour.`,
  application: `APPLICATION DE ${S} À KOLWEZI: A KCC Kolwezi, ${S} est partout. Dans l'atelier 15kV, on a 20 équipements de type ${S}. Panne fréquente: ${S} qui chauffe à 90 degrés. Cause 80%: poussière de cuivre qui bouche. Solution MAKOLA: nettoyer chaque semaine avec air comprimé, vérifier serrage boulons, mesurer avec multimètre.`,
  calcul: `CALCULS PRÉCIS POUR ${S}: Formule MAKOLA: Puissance = Tension x Courant. Si ${S} fait 380V et 10A, puissance = 3800W. Pour maison Kolwezi, besoin ${S} de 3kW minimum. Prix: ${S} neuf Chine 150$, occasion Lubumbashi 80$, qualité Europe 400$. Durée vie 10 ans si bien entretenu.`,
  business: `BUSINESS AVEC ${S}: Avec ${S}, tu peux gagner argent. Idée 1: réparation ${S} à domicile, 10$ par réparation, 3 par jour = 900$ par mois. Idée 2: vente ${S} au marché Mutoshi, marge 40%. Idée 3: formation ${S} pour jeunes, 20$ par élève. MAKOLA a formé 200 jeunes à Kolwezi avec ${S}.`,
  securite: `SÉCURITÉ ${S} - TRÈS IMPORTANT: ${S} peut tuer si mal utilisé. Règles: 1. Porte toujours casque, gants isolants, bottes. 2. Coupe courant avant toucher. 3. Utilise multimètre pour vérifier. 4. Ne travaille jamais seul. A KCC, accident avec ${S} = mort. Respecte LOTO, cadenassage.`
 };
}

async function generateOneVideo(sujet, title, theoryText, color, index){
 return new Promise(async (resolve)=>{
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  let stream=canvas.captureStream(30);
  let recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
  let chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
   let blob=new Blob(chunks,{type:'video/webm'});
   let url=URL.createObjectURL(blob);
   resolve({url, title, text:theoryText});
  };

  // Prépare visuel théorie
  ctx.fillStyle=color;
  ctx.fillRect(0,0,1280,720);
  // Header
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,1280,90);
  ctx.fillStyle='#00ff88';
  ctx.font='bold 28px Arial';
  ctx.textAlign='left';
  ctx.fillText(`MAKOLA AI - ${sujet.toUpperCase()} - Théorie ${index}`,20,55);
  // Titre théorie
  ctx.fillStyle='#fff';
  ctx.font='bold 52px Arial';
  ctx.textAlign='center';
  ctx.fillText(title,640,160);
  // Texte théorie découpé en lignes
  ctx.font='26px Arial';
  ctx.fillStyle='#e0e0e0';
  let words=theoryText.split(' ');
  let lines=[];
  let line='';
  for(let w of words){
   if((line+w).length>62){lines.push(line); line=w+' ';}
   else line+=w+' ';
  }
  lines.push(line);
  lines.slice(0,9).forEach((l,i)=>{
   ctx.fillText(l,640,240+i*42);
  });
  // Footer MAKOLA qui parle
  ctx.fillStyle='#ff6f00';
  ctx.font='bold 22px Arial';
  ctx.fillText('🎙️ MAKOLA PARLE - Professeur Kolwezi - MAKOLA.COM',640,680);

  recorder.start();
  speak(theoryText, ()=>{});
  // Animation barre progression + surlignage texte qui parle
  for(let p=0;p<=100;p+=2){
   // Effet surlignage ligne en cours
   let currentLine=Math.floor((p/100)*Math.min(9,lines.length));
   // Redessine avec surlignage
   ctx.fillStyle=color;
   ctx.fillRect(0,90,1280,630);
   ctx.fillStyle='#fff';
   ctx.font='bold 52px Arial';
   ctx.fillText(title,640,160);
   lines.slice(0,9).forEach((l,i)=>{
    if(i===currentLine){
     ctx.fillStyle='#00a651';
     ctx.fillRect(100, 215+i*42, 1080, 38);
     ctx.fillStyle='#fff';
    } else {
     ctx.fillStyle='#e0e0e0';
    }
    ctx.font=i===currentLine?'bold 28px Arial':'26px Arial';
    ctx.fillText(l,640,240+i*42);
   });
   ctx.fillStyle='#ff6f00';
   ctx.font='bold 22px Arial';
   ctx.fillText('🎙️ MAKOLA PARLE...',640,680);
   // Barre
   ctx.fillStyle='#fff';
   ctx.fillRect(0,700,1280*p/100,20);
   await new Promise(r=>setTimeout(r,80));
  }
  speechSynthesis.cancel();
  recorder.stop();
 });
}

async function start(){
 let q=document.getElementById('q').value.toLowerCase().trim();
 if(q.length<2) return;
 let theory=getTheory(q);
 document.getElementById('st').innerText=`🧠 MAKOLA génère 3 vidéos théories profondes pour "${q}"...`;
 document.getElementById('ai').innerHTML=`<div class="ai"><b>🤖 MAKOLA AI - COURS COMPLET ${q.toUpperCase()} - 6 THÉORIES PROFONDES</b><br><br>MAKOLA va générer 3 vidéos qui parlent vraiment de ta recherche avec théories, calculs, exemples Kolwezi.<br><br>Patiente 30 secondes... MAKOLA prépare les vidéos...</div>`;
 document.getElementById('videos').innerHTML=`<div style="text-align:center;padding:20px"><div style="color:#00ff88;font-size:16px">🎬 Génération en cours...</div><div style="background:#333;height:10px;border-radius:10px;margin:10px 0"><div id="globalBar" style="background:linear-gradient(90deg,#00a651,#ff6f00);height:10px;width:0%"></div></div><div id="globalText" style="color:#888;font-size:12px">Vidéo 1/3: Définition profonde...</div></div>`;

 let videosData=[
  {title:'DÉFINITION & FONCTIONNEMENT', text: theory.definition + ' ' + theory.fonctionnement, color:'#0a3d2e'},
  {title:'APPLICATION KOLWEZI & CALCULS', text: theory.application + ' ' + theory.calcul, color:'#1a2a4a'},
  {title:'BUSINESS & SÉCURITÉ', text: theory.business + ' ' + theory.securite, color:'#4a1a0a'}
 ];

 let results=[];
 for(let i=0;i<videosData.length;i++){
  document.getElementById('globalText').innerText=`Vidéo ${i+1}/3: ${videosData[i].title}...`;
  let res=await generateOneVideo(q, videosData[i].title, videosData[i].text, videosData[i].color, i+1);
  results.push(res);
  document.getElementById('globalBar').style.width=((i+1)/3*100)+'%';
 }

 document.getElementById('videos').innerHTML=results.map((v,i)=>`
 <div class="vbox">
 <div style="color:#00ff88;font-weight:bold;margin-bottom:8px">🎥 VIDÉO ${i+1}: ${v.title} - ${q.toUpperCase()}</div>
 <video controls playsinline src="${v.url}"></video>
 <div style="background:#222;padding:10px;border-radius:8px;margin:8px 0;font-size:13px;color:#ccc;line-height:1.5">${v.text}</div>
 <div style="text-align:center"><button onclick="speak('${v.text.replace(/'/g,"\\'")}')" style="background:#ff6f00;color:#fff;border:0;padding:8px 14px;border-radius:20px;margin:4px">🎙️ Réécouter théorie</button> <a href="${v.url}" download="MAKOLA-${q}-theorie${i+1}.webm" style="background:#00a651;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;display:inline-block;margin:4px">📥 Télécharger</a></div>
 </div>
 `).join('') + `<div style="background:linear-gradient(90deg,#00a651,#ff6f00);color:#fff;padding:12px;border-radius:10px;text-align:center;margin:10px 0">✅ 3 VIDÉOS THÉORIES GÉNÉRÉES POUR "${q}" - Par MAKOLA AI - Sans méga - MAKOLA.COM</div>`;

 document.getElementById('st').innerText=`✅ 3 vidéos théories profondes générées pour "${q.toUpperCase()}" - MAKOLA parle vraiment de ta recherche`;
}

speechSynthesis.getVoices();
</script></body></html>
