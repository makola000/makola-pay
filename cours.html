function bestKey(q){
q=q.toLowerCase();
let best=null; let bestScore=0;
for(let k in DATA){
let score=0;
let words=k.split(" ");
words.forEach(w=>{ if(q.includes(w)) score+=w.length; });
if(q.includes(k)) score+=k.length*2;
if(score>bestScore){bestScore=score; best=k;}
}
return best;
}

function GO(){
let raw=document.getElementById('s').value.trim();
if(raw.length<2) return;
let q=raw.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/c'est quoi|ce quoi|ces quoi|\?/g,"").trim();
let key=bestKey(q);
document.getElementById('vk').innerText=raw;
document.getElementById('stat').innerText="Trouvé: "+(key||"aucun - générique");

if(key && DATA[key]){
document.getElementById('tt').innerText=key.toUpperCase()+" - C'EST QUOI? (Théorie exacte)";
document.getElementById('td').innerText=DATA[key].t;
let html="";
DATA[key].v.forEach(v=>{
html+=`<div class="vcard" onclick="play('${v[0]}')"><img src="https://img.youtube.com/vi/${v[0]}/hqdefault.jpg"><div class="play">▶</div><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.88);color:#fff;padding:10px;font-weight:bold">${v[1]}<br><small style="color:#0f0">▶ CLIQUE = JOUE EN HAUT - EXACT POUR ${key.toUpperCase()}</small></div></div>`;
});
document.getElementById('vlist').innerHTML=html;
}else{
document.getElementById('tt').innerText=raw.toUpperCase()+" - Définition";
document.getElementById('td').innerText=`Théorie pour "${raw}":\n\nCe sujet concerne ${q}. C'est un domaine avec lois, formules, applications industrielles KCC. Tape un mot clé parmi: electricite, quantique, robotique arduino, chimie, bible, mine, trigo maths, electronique, ia, mecanique, pedagogie, metallurgie.`;
document.getElementById('vlist').innerHTML="<p>Tape un mot clé valide ci-dessus pour voir vidéos exactes</p>";
}
}
function play(id){
let p=document.getElementById('player');
p.style.display='block';
p.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
window.scrollTo({top:0,behavior:'smooth'});
}
