<div id="a"></div>
<script>
const DB=[
["1. CHIMIE ATOME pH H2SO4","#c0392b","LEGO invisible H2O=2H+1O Atome Z Cu29 Mole 6.02e23 CuO+H2SO4->CuSO4+H2O pH=-log[H+] KCC pH1.5 lixiv pH8.2","chimie atome ph h2so4"],
["2. ELECTRICITE U=RI P=UI 380V","#d35400","U=R*I P=U*I Triphase Transfo 11kV/380V 2MVA Cable 25mm2 98A Moteur 55kW","electricite U=RI triphase"],
["3. MINE CIEL OUVERT CAT6060 777F","#5d4037","Pit KCC 1km DM45 250mm ANFO 0.3kg/T CAT6060 34m3 CAT777F Cycle15min","mine pit CAT6060"],
["4. COBALT BATTERIE","#004d40","Carrollite 0.3%Co Lixiv H2SO4 MgO pH8.2 Co(OH)2 36% LME 33000$","cobalt batterie Co(OH)2"],
["5. KCC FLOW SHEET","#f39c12","ROM 2%Cu->Giratoire->SAG->Ball->Flott->SX->EW 99.99%Cu PCS7 5000T/j","KCC flow sheet"],
["6. METALLURGIE FLOTTATION SX EW","#00796b","Giratoire SAG Ball Flott xanthate 50g/T MIBC pH11.5 SX LIX63 EW 3.5V 300A/m2 99.99%","flottation SX EW"]
];
const EXTRA=["TOPO GPS DRONE","SECURITE LOTOTO H2S","MAINTENANCE CAT 250H","DCS PCS7 SCADA","BASSIN DECANTATION","SAP STOCK","SOUDURE HDPE","TRANSFO 2MVA","CHAUX pH11.5","GIRATOIRE","SAG 10MW","XANTHATE","EPAISSISSEUR 30m","LME CU CO","WARMAN POMPE","CONVOYEUR BANDE","H2S DETECTOR","LABO XRF","DM45 FORAGE","ANFO","CAT6060","777F","GEOTECH TALUS","POMPAGE","MOTEUR 55kW","CYANURE","COBALT pH8.2","KCC","COMUS","DRONE VOLUME","PERMIS FEU","ROULEMENT 6206","pH METRE","POUSSIERE","BUDGET","CELLULE FLOTT"];
EXTRA.forEach((t,i)=>{DB.push([`${7+i}. ${t}`,"#0a1628",`Cours ${t} KCC COMUS detail`,`${t.toLowerCase()}`]);});
const cont=document.getElementById('a');
function render(){cont.innerHTML="";DB.forEach(x=>{cont.innerHTML+=`<div class="c" data-k="${x[3]}"><h3 style="background:${x[1]}">${x[0]}</h3><div class="t">${x[2]}\n\n🔍 ${x[3]}</div></div>`;});}
function normalize(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function showVids(q){
let qn=q.toLowerCase();
let vids=[];
if(qn.includes("chim")||qn.includes("atome")||qn.includes("ph")){
vids=[["9fiCedUe1Sk","Atome ions et pH - Les Bons Profs"],["v5BLvvsJRN0","Acides et bases pH"],["ZWfJPBoApJ8","Atomes et molecules"]];
}else if(qn.includes("elect")){
vids=[["8Rwy6BL3AAQ","Combustion carbone chimie"],["9fiCedUe1Sk","Atome ions"]];
}else if(qn.includes("cobalt")||qn.includes("kcc")||qn.includes("mine")||qn.includes("flott")){
vids=[["9fiCedUe1Sk","Cours chimie KCC"],["v5BLvvsJRN0","pH acide base mine"],["ZWfJPBoApJ8","Atomes molecules"]];
}else{
vids=[["9fiCedUe1Sk","Chimie atome pH"],["v5BLvvsJRN0","Acides bases"],["ZWfJPBoApJ8","Atomes molecules"]];
}
let html="";
vids.forEach(v=>{
html+=`<a href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" style="text-decoration:none;color:#000"><div style="position:relative;margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid #ddd"><img src="https://img.youtube.com/vi/${v[0]}/hqdefault.jpg" style="width:100%;display:block"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,0,0,.9);color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px">▶</div><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;padding:6px;font-size:12px">${v[1]}</div></div></a>`;
});
html+=`<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q+' KCC Kolwezi mine cobalt')}" target="_blank" style="background:#ff0000;color:#fff;padding:12px;border-radius:25px;text-decoration:none;display:block;text-align:center;font-weight:bold;margin-top:10px">▶️ Voir 100+ vidéos "${q}" sur YouTube</a>
<a href="https://www.google.com/search?q=${encodeURIComponent(q+' KCC mine')}&udm=2" target="_blank" style="background:#0a1628;color:#fff;padding:12px;border-radius:25px;text-decoration:none;display:block;text-align:center;font-weight:bold;margin-top:8px">🔍 Google Images + Vidéos "${q}"</a>`;
document.getElementById('vkey').innerText=q||"tous";
document.getElementById('vlist').innerHTML=html;
}
function F(){
let q=document.getElementById('s').value;let qn=normalize(q);
let words=qn.split(/\s+/).filter(w=>w.length>1);
let cs=document.querySelectorAll('#a .c');let k=0;
cs.forEach(c=>{let txt=normalize(c.innerText+" "+c.dataset.k);let ok=qn==""||words.every(w=>txt.includes(w));c.style.display=ok?'block':'none';if(ok)k++;});
document.getElementById('n').innerText=k+" / 50 trouves pour '"+q+"'";
showVids(q);
}
render();showVids("chimie");
if(localStorage.getItem('makola_paid')=='yes')document.getElementById('pay').style.display='none';
function unlock(){localStorage.setItem('makola_paid','yes');document.getElementById('pay').remove();}
</script></body></html>
