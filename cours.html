<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA GOOGLE VRAI</title><style>
body{margin:0;font-family:Arial;background:#f1f5f9}.top{background:#0a1628;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:40}#s{width:94%;padding:15px;border-radius:25px;border:0;font-size:16px;font-weight:bold}#pay{position:fixed;inset:0;background:rgba(10,22,40,.97);z-index:99;display:flex;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:15px;padding:20px;max-width:420px;width:100%;text-align:center}.btn{background:#ff6a00;color:#fff;border:0;padding:14px;border-radius:10px;width:100%;font-weight:bold;margin-top:10px}.c{background:#fff;margin:12px;border-radius:12px;box-shadow:0 2px 10px #0001}.c h3{margin:0;padding:12px;color:#fff;border-radius:12px 12px 0 0;font-size:13px}.t{padding:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}#n{background:#fff;padding:8px;border-radius:10px;margin:8px 12px;font-size:12px;font-weight:bold}#vsec{background:#fff;margin:12px;border-radius:12px;padding:12px}#vsec iframe{width:100%;height:220px;border:0;border-radius:10px;margin:8px 0;background:#000} .q{background:#e3f2fd;padding:6px 12px;border-radius:20px;margin:4px;display:inline-block;font-size:12px;cursor:pointer;border:1px solid #0a4a8a}
</style></head><body>
<div id="pay"><div class="box"><h2>🔒 MAKOLA PAY</h2><input id="code" placeholder="Tape 123" style="border:1px solid #ccc;border-radius:10px;width:88%;padding:12px"><button class="btn" onclick="unlock()">✅ DEBLOQUER</button></div></div>
<div class="top"><h2 style="margin:0">🔍 MAKOLA GOOGLE</h2><input id="s" oninput="F()" placeholder="Tape: chimie, U=RI, cobalt, KCC..."><div id="n">50 cours + videos internet auto</div><div id="qs"></div></div>
<div id="a"></div>
<div id="vsec" style="display:none"><h3 style="margin:0 0 8px 0">🎥 Vidéos trouvées sur internet pour "<span id="vkey"></span>"</h3><div id="vlist"></div></div>
<script>
const DB=[
["1. CHIMIE ATOME pH","#c0392b","👶 LEGO invisible H2O\n👨‍🏫 Atome Z Cu29 Mole 6.02e23 pH=-log[H+] KCC pH1.5 lixiv pH8.2 CaO\n❓ c'est quoi chimie? atome? pH?","chimie atome ph"],
["2. ELECTRICITE U=RI","#d35400","U=R*I P=U*I Triphase √3 Transfo 11kV/380V Cable 25mm2 Moteur 55kW I=98A","electricite volt ampere"],
["3. MINE CIEL OUVERT CAT6060","#5d4037","Pit KCC 1km DM45 250mm ANFO 0.3kg/T CAT6060 34m3 CAT777F 15min","mine pit CAT6060"],
["4. COBALT Co(OH)2","#004d40","Carrollite 0.3%Co Lixiv H2SO4 MgO pH8.2 Co(OH)2 36% LME 33000$","cobalt Co(OH)2"],
["5. KCC FLOW SHEET","#f39c12","ROM 2%Cu->Giratoire->SAG->Ball->Flott->SX->EW 99.99%Cu 5000T/j","KCC flow sheet"],
["6. FLOTTATION SX EW","#00796b","Flott xanthate 50g/T MIBC pH11.5 SX LIX63 EW 3.5V 99.99% LME 162k$","flottation SX EW"]
];
const EXTRA=["TOPO GPS DRONE","SECURITE LOTOTO H2S","MAINTENANCE CAT 250H","INSTRUMENTATION DCS","ENVIRONNEMENT BASSIN","GESTION STOCK SAP","SOUDURE MIG TIG HDPE","TRANSFO 11kV 2MVA","CHAUX DOSAGE pH11.5","CONCASSEUR GIRATOIRE","BROYEUR SAG 10MW","FLOTTATION XANTHATE","EPAISSISSEUR 30m","SX EW 99.99%","LME PRIX CU CO","DIESEL CAT C18","POMPE WARMAN 10/8","CONVOYEUR BANDE 1200mm","DCS PCS7 SCADA","H2S DETECTOR","LABO AA XRF","DM45 FORAGE","ANFO EMULSION","PELLE CAT6060","CAT777F CYCLE","GEOTECH TALUS","HYDRO POMPAGE","MOTEUR 55kW","CYANURE NaCN","COBALT PRECIP pH8.2","KCC ORGANIGRAMME","COMUS PRODUCTION","VOLUME DRONE","PERMIS FEU","ROULEMENT 6206","pH METRE CPS11","POUSSIERE ARROSAGE","BUDGET MINE","HDPE SOUDURE","FLOTTATION CELLULE"];
EXTRA.forEach((t,i)=>{DB.push([`${7+i}. ${t}`,"#0a1628",`Cours ${t} KCC COMUS detail formule exemple securite`,`${t.toLowerCase()} KCC`]);});
const cont=document.getElementById('a');
function render(list){cont.innerHTML="";list.forEach(x=>{cont.innerHTML+=`<div class="c" data-k="${x[3]}"><h3 style="background:${x[1]}">${x[0]}</h3><div class="t">${x[2]}\n\n🔍 ${x[3]}</div></div>`;});}
function normalize(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function F(){
let q=document.getElementById('s').value;let qn=normalize(q);
let words=qn.split(/\s+/).filter(w=>w.length>1);
let cs=document.querySelectorAll('#a .c');let k=0;
cs.forEach(c=>{let txt=normalize(c.innerText+" "+c.dataset.k);let score=0;words.forEach(w=>{if(txt.includes(w))score++;});let ok=qn==""||score>0;c.style.display=ok?'block':'none';if(ok)k++;});
document.getElementById('n').innerText=k+" / 50 trouves";
let qs=document.getElementById('qs');
if(qn=="")qs.innerHTML='<span class=q onclick="setQ(\'chimie\')">chimie</span><span class=q onclick="setQ(\'electricite\')">electricite</span><span class=q onclick="setQ(\'cobalt\')">cobalt</span><span class=q onclick="setQ(\'KCC\')">KCC</span>';
// VIDEOS AUTO comme Google
let vsec=document.getElementById('vsec');let vlist=document.getElementById('vlist');let vkey=document.getElementById('vkey');
if(qn.length>=2){
vsec.style.display="block";vkey.innerText=q;
let query=encodeURIComponent(q+" mine KCC Kolwezi chimie");
vlist.innerHTML=`
<iframe src="https://www.youtube.com/embed?listType=search&list=${query}" allowfullscreen></iframe>
<p style="font-size:12px">Si la video ne charge pas, <a href="https://www.youtube.com/results?search_query=${query}" target="_blank">clique ici pour voir sur YouTube: ${q}</a></p>
<iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q+' flottation SX EW')}" allowfullscreen></iframe>
<iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q+' cours explication')}" allowfullscreen></iframe>
`;
}else{vsec.style.display="none";}
}
function setQ(t){document.getElementById('s').value=t;F();}
render(DB);
if(localStorage.getItem('makola_paid')=='yes')document.getElementById('pay').style.display='none';
function unlock(){localStorage.setItem('makola_paid','yes');document.getElementById('pay').remove();}
</script></body></html>
