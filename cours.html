<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA GOOGLE</title><style>
body{margin:0;font-family:Arial;background:#fff}.top{background:#0a1628;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:99}#s{width:96%;padding:18px;border-radius:30px;border:0;font-size:18px;font-weight:bold;outline:none}#box{padding:14px;min-height:200px}#titre{font-size:22px;font-weight:bold;margin:0 0 10px 0}#desc{font-size:15px;line-height:1.8;white-space:pre-wrap}#player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;border:3px solid #ff6a00}#vsec{margin:12px;background:#f8f9fa;border-radius:12px;padding:12px}
</style></head><body>
<div class="top"><h2 style="margin:0 0 10px 0">🔍 MAKOLA - COMME GOOGLE</h2><input id="s" oninput="GO()" placeholder="Tape: électricité c'est quoi, physique quantique, arduino..."><div style="margin-top:8px;font-size:12px">Tape n'importe quoi → théorie profonde + vidéos qui jouent ICI</div></div>

<div id="box"><h2 id="titre">Tape une recherche ci-dessus...</h2><p id="desc">Ex: électricité, robotique, bible, mine ciel ouvert, chimie, IA</p></div>

<div id="vsec"><h3>🎥 Vidéos pour "<span id="vkey" style="color:#ff6a00"></span>" - Lecture directe sur MAKOLA</h3>
<iframe id="player" frameborder="0" allowfullscreen allow="autoplay"></iframe>
<div id="vlist" style="margin-top:10px"></div>
</div>

<script>
async function GO(){
let q=document.getElementById('s').value.trim();
if(q.length<2) return;
document.getElementById('vkey').innerText=q;
document.getElementById('titre').innerText="🔍 Recherche: "+q+"...";
document.getElementById('desc').innerText="Chargement explication profonde...";

// 1. THEORIE PROFONDE = WIKIPEDIA comme Google
try{
let wikiQ=encodeURIComponent(q);
let res=await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${wikiQ}`);
let data=await res.json();
if(data.extract){
document.getElementById('titre').innerText=data.title+" - "+q;
document.getElementById('desc').innerText=data.extract+"\n\n---\nSource: Wikipedia - Définition profonde de "+q+"\n\nSi tu veux plus: "+q+" c'est quoi? En physique, c'est l'étude de...\nFormules, applications, exemples concrets, histoire.";
}else{
throw "no wiki";
}
}catch(e){
// Fallback explication si Wikipedia ne trouve pas
document.getElementById('titre').innerText="📚 "+q.toUpperCase()+" - C'est quoi?";
document.getElementById('desc').innerText=`DÉFINITION PROFONDE DE: ${q.toUpperCase()}

${q} est un domaine qui étudie...

1. DÉFINITION:
${q} c'est l'ensemble des phénomènes, lois et applications liées à ${q}.

2. HISTOIRE:
Découvert et développé depuis des siècles, ${q} a évolué avec la science.

3. FORMULES / PRINCIPES:
- Loi fondamentale de ${q}
- Applications pratiques
- Exemples concrets dans l'industrie (KCC, mines, électricité)

4. APPLICATIONS:
Utilisé en industrie, école, maison, technologie moderne.

Ceci est une explication auto-générée comme Google pour ta recherche: "${q}". Pour une explication encore plus profonde, Wikipédia dit que ${q} est un sujet vaste.`;
}

// 2. VIDEOS COMME GOOGLE - YouTube Search qui joue SUR TON SITE
let ytQuery=encodeURIComponent(q+" cours tutoriel");
document.getElementById('player').style.display='block';
// Playlist YouTube search qui joue direct sur ton site
document.getElementById('player').src=`https://www.youtube.com/embed?listType=search&list=${ytQuery}&autoplay=0`;

// 3 videos vignettes qui jouent ICI quand on clique
let html="";
let suggestions=[q+" cours complet", q+" explication", q+" tutoriel débutant"];
suggestions.forEach((sq,i)=>{
let sqEnc=encodeURIComponent(sq);
html+=`<div onclick="document.getElementById('player').src='https://www.youtube.com/embed?listType=search&list=${sqEnc}&autoplay=1'" style="background:#fff;border:2px solid #333;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;font-weight:bold">▶️ ${sq} <br><small style="color:#666">Clique pour lire ICI sur MAKOLA - pas sur YouTube</small></div>`;
});
document.getElementById('vlist').innerHTML=html;
}
</script></body></html>
