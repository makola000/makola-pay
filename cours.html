<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA 50 COURS + VIDEOS</title><style>

</style></head><body>
<div id="pay"><div class="box"><h2>🔒 MAKOLA PAY</h2><div style="background:#f5f5f5;padding:10px;border-radius:10px;font-weight:bold">098 33 56 734 M-Pesa / 082 047 95 39 Orange</div><input id="code" placeholder="Tape 123" style="border:1px solid #ccc;border-radius:10px;width:88%;padding:12px;margin-top:10px"><button class="btn" onclick="unlock()">✅ DEBLOQUER</button></div></div>
<div class="top"><h2 style="margin:0">🔍 MAKOLA 50 COURS + VIDEO</h2><input id="s" oninput="F()" placeholder="chimie, U=RI, cobalt, KCC, CAT6060..."><div id="n">50 cours avec videos</div></div>
<div id="a"></div>
<script>
const DB=[
["1. CHIMIE ATOME pH H2SO4","#c0392b","Atome Z Cu29 Mole 6.02e23 pH=-log[H+] KCC pH1.5","chimie atome ph","9fiCedUe1Sk"],
["2. ELECTRICITE U=RI 380V","#d35400","U=R*I P=U*I Triphase 11kV/380V Moteur 55kW 98A","electricite U=RI","8Rwy6BL3AAQ"],
["3. MINE CIEL OUVERT CAT6060","#5d4037","Pit KCC DM45 ANFO CAT6060 34m3 CAT777F","mine pit CAT6060","9fiCedUe1Sk"],
["4. COBALT Co(OH)2","#004d40","Carrollite 0.3%Co MgO pH8.2 Co(OH)2 36% LME 33000$","cobalt Co(OH)2","v5BLvvsJRN0"],
["5. KCC FLOW SHEET","#f39c12","ROM 2%Cu->EW 99.99%Cu 5000T/j","KCC flow sheet","ZWfJPBoApJ8"],
["6. FLOTTATION SX EW","#00796b","Flott xanthate SX LIX63 EW 3.5V 99.99%","flottation SX EW","9fiCedUe1Sk"]
];
const EXTRA=["TOPO GPS DRONE","SECURITE LOTOTO H2S","MAINTENANCE CAT 250H","DCS PCS7 SCADA","BASSIN DECANTATION","SAP STOCK","SOUDURE HDPE","TRANSFO 2MVA","CHAUX pH11.5","GIRATOIRE","SAG 10MW","XANTHATE","EPAISSISSEUR 30m","LME CU CO","WARMAN POMPE","CONVOYEUR BANDE","H2S DETECTOR","LABO XRF","DM45 FORAGE","ANFO","CAT6060","777F","GEOTECH TALUS","POMPAGE","MOTEUR 55kW","CYANURE","COBALT pH8.2","KCC","COMUS","DRONE VOLUME","PERMIS FEU","ROULEMENT 6206","pH METRE","POUSSIERE","BUDGET","CELLULE FLOTT"];
const VIDS=["9fiCedUe1Sk","v5BLvvsJRN0","ZWfJPBoApJ8","8Rwy6BL3AAQ"];
EXTRA.forEach((t,i)=>{let vid=VIDS[i%VIDS.length];DB.push([`${7+i}. ${t}`,"#0a1628",`Cours ${t} KCC COMUS detail formule exemple securite.`,`${t.toLowerCase()}`,vid]);});
const cont=document.getElementById('a');
function render(list){cont.innerHTML="";list.forEach(x=>{
let vid=x[4];let key=x[3];
cont.innerHTML+=`<div class="c" data-k="${key}"><h3 style="background:${x[1]}">${x[0]}</h3><div class="t">${x[2]}\n\n🔍 ${key}\n\n<a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent(key+' KCC Kolwezi cours')}" target="_blank"><img src="https://img.youtube.com/vi/${vid}/hqdefault.jpg"><div class="play">▶</div><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;padding:5px;font-size:11px">🎥 Video: ${x[0]} - Clique pour voir</div></a><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(key+' KCC mine')}" target="_blank" style="background:#ff0000;color:#fff;padding:8px 12px;border-radius:20px;text-decoration:none;display:inline-block;font-size:12px;font-weight:bold;margin-top:6px">▶️ Voir 10 vidéos "${key}" sur YouTube</a></div></div>`;
});}
function normalize(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function F(){
let q=document.getElementById('s').value;let qn=normalize(q);
let words=qn.split(/\s+/).filter(w=>w.length>1);
let cs=document.querySelectorAll('#a .c');let k=0;
cs.forEach(c=>{let txt=normalize(c.innerText+" "+c.dataset.k);let ok=qn==""||words.every(w=>txt.includes(w));c.style.display=ok?'block':'none';if(ok)k++;});
document.getElementById('n').innerText=k+" / 50 trouves pour '"+q+"'";
}
render(DB);
if(localStorage.getItem('makola_paid')=='yes')document.getElementById('pay').style.display='none';
function unlock(){localStorage.setItem('makola_paid','yes');document.getElementById('pay').remove();}
</script></body></html>
