<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO</title></head>
<body style="font-family:Arial;padding:15px">
<h1>MAKOLA GO</h1>
<input id="q" style="width:100%;padding:20px;font-size:22px;border:3px solid blue" placeholder="Tape ASTROLOGIE">
<button onclick="go()" style="width:100%;padding:20px;font-size:22px;background:blue;color:white;margin-top:15px">CHERCHER MAINTENANT</button>
<div id="R" style="margin-top:20px"></div>
<script>
function go(){
var m=document.getElementById('q').value;
alert("Tu as tapé: "+m);
document.getElementById('R').innerHTML="<h2>"+m+"</h2><a href='https://www.youtube.com/results?search_query="+m+"' target='_blank' style='display:block;padding:20px;background:red;color:white;text-align:center;font-size:20px'>▶ CLIQUE ICI YOUTUBE "+m+"</a><br><a href='https://www.google.com/search?q="+m+"' target='_blank' style='display:block;padding:20px;background:blue;color:white;text-align:center;font-size:20px'>🔍 CLIQUE ICI GOOGLE "+m+"</a>";
}
</script>
</body></html>
