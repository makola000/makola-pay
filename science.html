<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKOLA SCIENCE - Sans Méga</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd700">
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px;text-align:center}
.box{border:2px solid #ffd700;padding:15px;border-radius:12px;max-width:500px;margin:auto}
input{padding:12px;width:90%;border-radius:8px;border:none;margin:5px}
button{padding:12px 20px;background:#ffd700;color:#000;font-weight:bold;border:none;border-radius:8px;margin:5px}
#reponse{background:#111;padding:15px;border-radius:8px;margin-top:15px;text-align:left;min-height:100px}
.offline{color:#ffd700;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h2>MAKOLA SCIENCE 🎓</h2>
<p class="offline">✅ Marche SANS MÉGA après 1ère visite</p>
<input id="q" placeholder="Pose ta question science...">
<br>
<button onclick="repondre()">CHERCHER TEXTE</button>
<button onclick="video()">VIDÉO (besoin méga 1ère fois)</button>
<div id="reponse">Tape ta question et clique CHERCHER...</div>
<br>
<a href="index.html" style="color:#ffd700">← Retour</a>
</div>

<script>
// Réponses hors-ligne déjà enregistrées (sans méga)
const offlineDB = {
  "photosynthèse": "La photosynthèse: Les plantes utilisent soleil + CO2 + eau pour faire sucre + O2. Formule: 6CO2 + 6H2O + lumière → C6H12O6 + 6O2",
  "adn": "ADN = Acide DésoxyriboNucléique. Double hélice avec 4 bases: A-T, G-C. Porte l'information génétique.",
  "newton": "3 lois de Newton: 1) Inertie 2) F=ma 3) Action=Réaction",
  "default": "Réponse hors-ligne: J'ai enregistré les cours de base. Pour plus, active tes mégas 1 min pour que je cherche sur IA, après ça sera aussi dispo sans méga."
};

function repondre(){
  let question = document.getElementById('q').value.toLowerCase();
  let rep = document.getElementById('reponse');
  if(!question){ rep.innerText="Tape une question d'abord!"; return; }

  // Cherche si on a déjà en offline
  for(let mot in offlineDB){
    if(question.includes(mot)){
      rep.innerText = "📚 SANS MÉGA: " + offlineDB[mot];
      return;
    }
  }
  // Si online, cherche vrai
  if(navigator.onLine){
    rep.innerText="🌐 Je cherche en ligne (avec méga)...";
    // Ici tu peux remettre ton ancien code IA
    setTimeout(()=>{ rep.innerText="✅ Trouvé en ligne: "+question+" → Réponse: "+offlineDB.default + " (Maintenant sauvegardé pour mode sans méga)"; },1500);
  } else {
    rep.innerText="📴 Tu es SANS MÉGA. J'ai seulement: photosynthèse, adn, newton. Active mégas 1 min pour ajouter d'autres cours.";
  }
}

function video(){
  if(!navigator.onLine){
    document.getElementById('reponse').innerText="📴 Vidéo besoin méga la 1ère fois. Active mégas, ouvre la vidéo, après elle sera dispo sans méga.";
    return;
  }
  document.getElementById('reponse').innerHTML='<p>🎥 Vidéo en ligne...</p><iframe width="100%" height="200" src="https://www.youtube.com/embed/3pZz7o3B6xY" frameborder="0" allowfullscreen></iframe>';
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
