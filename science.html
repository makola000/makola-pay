
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKOLA AI - TOUTES LES SCIENCES</title>
<style>
body{font-family:Arial;text-align:center;padding:10px;background:#000;color:#fff}
.logo{font-size:50px;font-weight:900;color:#ffd700}.small{letter-spacing:6px;color:#aaa}
.box{border:2px solid #ffd700;border-radius:30px;max-width:800px;margin:20px auto;padding:14px 20px;display:flex;background:#111}
.box input{border:none;outline:none;width:100%;font-size:17px;margin-left:10px;background:#111;color:white}
#rep{max-width:850px;margin:auto;text-align:left;background:#111;border:1px solid #333;padding:22px;border-radius:14px;display:none;line-height:1.7;white-space:pre-wrap}
.tag{background:#ffd700;color:#000;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<script>
// BLOCAGE PAIEMENT - Si pas payé, retourne au paiement
if(localStorage.getItem('makola_paye')!=='oui'){
  window.location.href='index.html';
}
</script>

<div class="logo">makola AI</div>
<div class="small">TOUTES LES SCIENCES + IA - ACCÈS PAYÉ</div>
<div class="box">🤖 <input id="q" placeholder="Pose ta question scientifique..." onkeypress="if(event.key==='Enter')go()"></div>
<button onclick="go()" style="padding:12px 35px;background:#ffd700;color:#000;border:none;border-radius:20px;font-weight:bold">DEMANDER À L'IA</button>
<button onclick="logout()" style="padding:8px 15px;background:#333;color:#fff;border:none;border-radius:10px;margin-left:10px">Sortir</button>
<div id="rep"></div>

<script>
const LOCAL={
"cuivre":"CUIVRE Kolwezi: 9500$/t, 70% prod RDC.",
"cobalt":"COBALT: 33000$/t, capitale Kolwezi.",
"plc":"PLC: Siemens S7-1200, Ladder, SCADA WinCC.",
"spectre":"SPECTRE EM: Radio < Micro-onde < IR < Visible(400-700nm) < UV < X < Gamma. c=λf",
"beton":"BÉTON: 350kg/m3, fondation 1.5m Kolwezi.",
"adn":"ADN: double hélice A-T-C-G, 46 chromosomes."
};

async function go(){
let v=document.getElementById('q').value.trim(); if(!v)return;
let r=document.getElementById('rep'); r.style.display='block'; r.innerHTML='🤖 Makola AI réfléchit...';
let vl=v.toLowerCase();
for(let k in LOCAL){ if(vl.includes(k)){ r.innerHTML='<span class="tag">LOCAL</span><br><br>'+LOCAL[k]; return; } }
try{
 let aiRes = await fetch('https://text.pollinations.ai/'+encodeURIComponent('Tu es Makola Intelligence expert toutes sciences Kolwezi. Réponds français court à: '+v));
 let aiText = await aiRes.text();
 if(aiText && aiText.length>10){ r.innerHTML='<span class="tag">MAKOLA AI</span><br><br>'+aiText; return; }
}catch(e){}
try{
 let w=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(v));
 let d=await w.json(); if(d.extract){ r.innerHTML='<span class="tag">WIKIPÉDIA</span><br><br>'+d.extract; return; }
}catch(e){}
r.innerHTML='IA occupée.';
}
function logout(){ localStorage.removeItem('makola_paye'); window.location.href='index.html'; }
</script>
</body>
</html>
