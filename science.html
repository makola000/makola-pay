
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>makola intelligence</title>
<style>
body{text-align:center;font-family:Arial;margin:0}
.logo{margin-top:100px;font-size:60px;font-weight:900}
.small{font-size:24px;letter-spacing:8px;color:#666}
.box{border:1px solid #ccc;border-radius:30px;width:90%;max-width:500px;margin:30px auto;padding:15px;display:flex}
.box input{border:none;outline:none;width:100%;font-size:16px}
button{padding:10px 20px;margin:10px;border:none;background:#f2f2f2;border-radius:5px}
</style>
</head>
<body>
<div class="logo">makola</div>
<div class="small">INTELLIGENCE</div>
<div class="box">🔍 <input id="q" placeholder="Pose ta question..." onkeypress="if(event.key==='Enter')go()"></div>
<button onclick="go()">Rechercher</button>
<script>
function go(){
let v=document.getElementById('q').value;
if(!v)return alert('Écris une question');
window.location.href='https://wa.me/243983356734?text='+encodeURIComponent(v);
}
</script>
</body>
</html>
