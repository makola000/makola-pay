
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>makola intelligence - Science</title>
<style>
body{font-family:Arial;text-align:center;padding:20px}
.logo{font-size:55px;font-weight:900;margin-top:40px}
.small{letter-spacing:7px;color:#666}
.box{border:1px solid #aaa;border-radius:30px;max-width:600px;margin:20px auto;padding:12px 20px;display:flex}
.box input{border:none;outline:none;width:100%;font-size:16px;margin-left:10px}
#rep{max-width:700px;margin:20px auto;text-align:left;background:#f5f7ff;padding:20px;border-radius:12px;display:none;line-height:1.6}
</style>
</head>
<body>
<div class="logo">makola</div>
<div class="small">SCIENCE INTELLIGENCE</div>
<div class="box">🔬 <input id="q" placeholder="Pose n'importe quelle question scientifique..." onkeypress="if(event.key==='Enter')go()"></div>
<button onclick="go()" style="padding:10px 25px;background:#4285F4;color:white;border:none;border-radius:20px">Chercher</button>
<div id="rep"></div>
<script>
const localDB={"cuivre":"Cuivre Kolwezi: 9500$/t, 70% production RDC.","cobalt":"Cobalt: capitale mondiale Kolwezi, batterie.","electricite":"Électricité: barrage Busanga 240MW pour Kolwezi.","atome":"Atome: plus petite partie de la matière, noyau + électrons.","photosynthese":"Photosynthèse: plante transforme soleil + CO2 en sucre + oxygène.","gravite":"Gravité: force qui attire les objets vers la terre, 9.8 m/s²."};
async function go(){
let v=document.getElementById('q').value.trim(); if(!v)return alert('Écris une question');
let r=document.getElementById('rep'); r.style.display='block'; r.innerHTML='Recherche en cours... 🔍';
let vl=v.toLowerCase();
for(let k in localDB){ if(vl.includes(k)){ r.innerHTML='<b>Makola répond (Local):</b><br><br>'+localDB[k]; return; } }
try{
let res=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(v));
let data=await res.json();
if(data.extract){ r.innerHTML='<b>Réponse Scientifique (Wikipédia):</b><br><br><b>'+data.title+'</b><br>'+data.extract+'<br><br><a href="'+data.content_urls.desktop.page+'" target="_blank">Lire plus sur Wikipédia</a>'; return; }
} catch(e){}
r.innerHTML='Je n\'ai pas trouvé sur Wikipédia. Je transfère à l\'expert.<br><br><a href="https://wa.me/243983356734?text='+encodeURIComponent(v)+'"><button style="padding:10px 20px;background:green;color:white;border:none;border-radius:10px">Demander sur WhatsApp</button></a>';
}
</script>
</body>
</html>
