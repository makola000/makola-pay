<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MAKOLA Recherche</title><style>body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:30px}h1{font-size:32px}.box{max-width:600px;margin:30px auto;background:#1e293b;padding:30px;border-radius:20px}input{width:95%;padding:18px;font-size:18px;border-radius:50px;border:none}.btns{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{padding:14px 24px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}.g{background:white}.y{background:red;color:white}.w{background:#e2e8f0}</style></head>
<body><h1>🔎 MAKOLA SEARCH</h1><p>Tape et choisis où chercher</p><div class="box"><input id="q" placeholder="Ex: photosynthèse"><div class="btns"><button class="g" onclick="go('g')">Google</button><button class="y" onclick="go('y')">YouTube</button><button class="w" onclick="go('w')">Wikipedia</button></div></div><p><a href="./" style="color:#60a5fa">← Retour accueil</a></p><script>function go(t){let v=document.getElementById('q').value.trim();if(!v){alert('Tape quelque chose!');return;}let u=t=='g'?'https://www.google.com/search?q='+encodeURIComponent(v):t=='y'?'https://www.youtube.com/results?search_query='+encodeURIComponent(v):'https://fr.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(v);window.open(u,'_blank');}</script></body></html>
