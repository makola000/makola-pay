<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA</title><style>body{margin:0;font-family:Arial;background:#fff}.top{background:#0a1628;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:99}#s{width:96%;padding:18px;border-radius:30px;border:0;font-size:18px;font-weight:bold;outline:none}#player{width:calc(100% - 24px);aspect-ratio:16/9;background:#000;border-radius:12px;margin:12px;border:3px solid #ff6a00;display:none}.box{margin:12px;background:#f8f9fa;border-radius:12px;padding:14px;border-left:6px solid #ff6a00;white-space:pre-wrap;line-height:1.8}.vcard{position:relative;border-radius:12px;overflow:hidden;border:2px solid #000;margin:10px 0;cursor:pointer}.vcard img{width:100%;height:200px;object-fit:cover}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:red;color:#fff;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px}</style></head><body>
