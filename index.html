<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA PAY</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.top{background:blue;padding:15px;text-align:center;color:white}
.logo{font-size:28px;font-weight:bold}
.tabs{display:flex;background:#222;overflow-x:auto}
.tabs div{padding:14px 12px;text-align:center;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:#aaa;font-size:13px;font-weight:bold}
.tabs div.active{border-bottom:3px solid blue;color:white;background:#000}
input{width:90%;padding:18px;margin:15px 5%;border-radius:12px;border:3px solid blue;font-size:18px;box-sizing:border-box}
button{width:90%;margin:0 5%;padding:18px;background:blue;color:white;border:none;border-radius:12px;font-size:18px;font-weight:bold}
.card{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 2px 4px #ccc}
iframe{width:100%;height:420px;border:none;border-radius:12px;background:white}
.btn{display:block;padding:18px;margin-top:12px;text-align:center;color:white;text-decoration:none;border-radius:12px;font-size:18px;font-weight:bold}
</style>
</head><body>
<div class="top"><div class="logo">⭐ MAKOLA PAY</div>Moteur de Kolwezi - Tout en un</div>
<input id="q" placeholder="Tape: Astrologie, Musique...">
<button onclick="searchAll()">🔍 CHERCHER</button>
<div class="tabs">
<div id="t1" class="active" onclick="showTab(1)">▶ YOUTUBE</div>
<div id="t2" onclick="showTab(2)">🔍 GOOGLE</div>
<div id="t3" onclick="showTab(3)">📖 WIKIPEDIA</div>
<div id="t4" onclick="showTab(4)">🎵 TIKTOK</div>
<div id="t5" onclick="showTab(5)">📘 FACEBOOK</div>
</div>
<div id="R"><div class=card style="text-align:center;padding:30px">👆 Tape un mot en haut et clique CHERCHER<br><br>Ex: Astrologie</div></div>
<script>
let currentQ="";
function showTab(n){
document.querySelectorAll('.tabs div').forEach(d=>d.classList.remove('active'));
document.getElementById('t'+n).classList.add('active');
if(currentQ) loadTab(n,currentQ);
}
function searchAll(){
let m=document.getElementById('q').value.trim();
if(!m)return alert("Tape un mot d'abord");
currentQ=m;
showTab(1);
}
async function loadTab(tab,q){
let R=document.getElementById('R');
if(tab==1){
R.innerHTML="<div class=card>Chargement YouTube: "+q+"...</div>";
try{
let r=await fetch("https://pipedapi.kavin.rocks/search?q="+encodeURIComponent(q));
let j=await r.json();
let v=j.items.filter(x=>x.type=="stream").slice(0,3);
let h="";
v.forEach(x=>{
let id=(x.url.split('v=')[1]||x.url.split('/').pop()).split('&')[0];
h+=`<div class=card><b>${x.title.substring(0,70)}</b><br><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen style="height:220px;margin-top:8px;background:black"></iframe></div>`;
});
R.innerHTML=h+`<div class=card><a class=btn style="background:red" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank">▶ PLUS SUR YOUTUBE</a></div>`;
}catch(e){
R.innerHTML=`<div class=card><b>YOUTUBE: ${q}</b><iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}" style="background:black"></iframe></div>`;
}
}
if(tab==2){
R.innerHTML=`<div class=card><b>Google: ${q}</b><iframe src="https://www.google.com/search?igu=1&q=${encodeURIComponent(q)}"></iframe><a class=btn style="background:#4285f4" href="https://www.google.com/search?q=${encodeURIComponent(q)}" target=_blank>🔍 Ouvrir Google</a></div>`;
}
if(tab==3){
R.innerHTML=`<div class=card><b>Wikipedia: ${q}</b><iframe src="https://fr.wikipedia.org/wiki/${encodeURIComponent(q)}"></iframe><a class=btn style="background:#000" href="https://fr.wikipedia.org/wiki/${encodeURIComponent(q)}" target=_blank>📖 Ouvrir Wikipedia</a></div>`;
}
if(tab==4){
R.innerHTML=`<div class=card style="text-align:center"><h2>🎵 TikTok: ${q}</h2><p>TikTok bloque l'affichage dans les autres sites (c'est leur règle)</p><div style="font-size:80px">🎵</div><a class=btn style="background:black" href="https://www.tiktok.com/search?q=${encodeURIComponent(q)}" target=_blank>▶ VOIR ${q} SUR TIKTOK</a><p style="font-size:13px;color:#666;margin-top:10px">Après tu reviens sur MAKOLA PAY, ta page reste ouverte</p></div>`;
}
if(tab==5){
R.innerHTML=`<div class=card style="text-align:center"><h2>📘 Facebook: ${q}</h2><p>Facebook bloque aussi l'affichage (c'est leur règle)</p><div style="font-size:80px">📘</div><a class=btn style="background:#1877f2" href="https://www.facebook.com/watch/search/?q=${encodeURIComponent(q)}" target=_blank>▶ VOIR ${q} SUR FACEBOOK</a></div>`;
}
}
</script>
</body></html>
