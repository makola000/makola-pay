<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA - YouTube + Google</title><style>body{font-family:Arial;background:#f0f2f5;padding:15px;max-width:900px;margin:auto}input{width:100%;padding:16px;font-size:20px;border-radius:10px;border:2px solid #1877f2;box-sizing:border-box}.card{background:white;padding:20px;border-radius:12px;margin-top:20px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}a.btn{display:block;padding:14px;margin:8px 0;border-radius:8px;text-decoration:none;font-weight:bold;text-align:center}.yt{background:#ff0000;color:white}.gg{background:#1877f2;color:white}.pdf{background:#ff9800;color:white}</style></head><body>
<h1>MAKOLA SCIENCE</h1><p>Tape un cours, je cherche sur YouTube et Google pour toi:</p><input id="q" placeholder="Ex: Astrologie, Biologie, Chimie..." onkeyup="if(event.key==='Enter')chercher()"><br><br><button onclick="chercher()" style="padding:12px 30px;background:#1877f2;color:white;border:none;border-radius:8px;font-size:18px">CHERCHER</button><div id="R"></div>
<script>
function chercher(){
var mot=document.getElementById('q').value.trim();
if(mot==""){alert("Tape un cours d'abord");return;}
var ytb="https://www.youtube.com/results?search_query="+encodeURIComponent(mot+" cours complet");
var googDef="https://www.google.com/search?q="+encodeURIComponent(mot+" definition cours");
var googPdf="https://www.google.com/search?q="+encodeURIComponent(mot+" cours pdf");
var wiki="https://fr.wikipedia.org/wiki/"+encodeURIComponent(mot);
document.getElementById('R').innerHTML=`
<div class=card>
<h2>📖 ${mot} - Définition</h2><p>Définition complète de ${mot} - Théories et formules</p>
<a class=btn gg href="${googDef}" target="_blank">🔍 Voir définition sur Google</a>
<a class=btn gg href="${wiki}" target="_blank">📚 Voir sur Wikipedia</a>
</div>
<div class=card>
<h2>🎥 ${mot} - Vidéos YouTube</h2><p>Toutes les vidéos de ${mot}</p>
<a class=btn yt href="${ytb}" target="_blank">▶️ Voir vidéos YouTube de ${mot}</a>
<iframe width="100%" height="250" src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(mot+' cours')}" frameborder="0" allowfullscreen></iframe>
</div>
<div class=card>
<h2>📄 ${mot} - PDF (hors site)</h2><p>PDF de ${mot} à lire hors ligne</p>
<a class=btn pdf href="${googPdf}" target="_blank">⬇️ Télécharger PDF de ${mot} sur Google</a>
</div>
<div class=card><h3>✅ C'est comme YouTube + Google combinés!</h3><p>Chaque recherche de ${mot} montre définition + vidéos + PDF automatiquement. Ça marche pour les 300 cours.</p></div>
`;
}
</script></body></html>
