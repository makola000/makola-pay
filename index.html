<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKOLA PAY - Navigateur</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{background:#1e293b;padding:10px;display:flex;gap:5px;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:bold;color:#38bdf8;margin-right:10px}
.tabs button{padding:8px 12px;border:none;border-radius:20px;cursor:pointer;background:#334155;color:white}
.tabs button.active{background:#38bdf8;color:#000;font-weight:bold}
.search-box{flex:1;display:flex;gap:5px}
.search-box input{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
.search-box button{padding:10px 15px;border-radius:20px;border:none;background:#facc15;font-weight:bold;cursor:pointer}
iframe{width:100%;height:calc(100vh - 60px);border:none;background:white}
</style>
</head>
<body>
<header>
<span class="logo">MAKOLA PAY V3</span>
<div class="tabs">
<button id="btn-yt" class="active" onclick="switchTab('yt')">▶️ YouTube</button>
<button id="btn-go" onclick="switchTab('go')">🔍 Google</button>
<button id="btn-wiki" onclick="switchTab('wiki')">📚 Wiki</button>
</div>
<div class="search-box">
<input id="q" placeholder="Tape: Fally Ipupa, Actualités..." onkeydown="if(event.key==='Enter')doSearch()">
<button onclick="doSearch()">GO</button>
</div>
</header>
<iframe id="view" src="https://www.youtube.com/embed?listType=search&list=musique%20congo%202026"></iframe>

<script>
let currentTab = 'yt';
function switchTab(t){
 currentTab=t;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn-'+t).classList.add('active');
 doSearch();
}
function doSearch(){
 let query = document.getElementById('q').value || 'musique congo';
 let frame = document.getElementById('view');
 let q = encodeURIComponent(query);
 if(currentTab==='yt'){
   // ASTUCE V3: embed search autorisé par YouTube
   frame.src = `https://www.youtube.com/embed?listType=search&list=${q}&autoplay=1`;
 }else if(currentTab==='go'){
   // Google bloque iframe, on utilise DuckDuckGo qui autorise
   frame.src = `https://duckduckgo.com/?q=${q}&ia=web`;
 }else{
   frame.src = `https://fr.wikipedia.org/wiki/Special:Search?search=${q}&go=Go`;
 }
}
</script>
</body>
</html>
