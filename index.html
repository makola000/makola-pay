<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA PAY</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#0f0f0f;color:#fff}.h{background:#0000ff;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0}.tabs{display:flex;background:#212121;position:sticky;top:48px}.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent}.tab.a{border-color:#00c6ff;color:#00c6ff;background:#333}.box{padding:10px}input{width:100%;padding:13px;border-radius:25px;border:1px solid #444;background:#121212;color:#fff}button{width:100%;padding:12px;background:#0000ff;color:#fff;border:none;border-radius:25px;margin-top:8px;font-weight:bold}iframe{width:100%;height:78vh;border:none;border-radius:10px;background:#fff;margin-top:10px}</style></head>
<body><div class="h">MAKOLA PAY V2 - TOUT JOUE ICI 🇨🇩</div><div class="tabs">
<div class="tab a" id="tY" onclick="o('Y')">▶️ YouTube</div><div class="tab" id="tG" onclick="o('G')">🔍 Google</div><div class="tab" id="tW" onclick="o('W')">📚 Wiki</div></div>
<div class="box" id="bY"><input id="qY" placeholder="Tape artiste: Fally Ipupa"><button onclick="pY()">JOUER DANS MAKOLA PAY</button><iframe id="fY" src="https://yewtu.be/search?q=musique+congolaise"></iframe></div>
<div class="box" id="bG" style="display:none"><input id="qG" placeholder="Tape: météo Lubumbashi"><button onclick="pG()">CHERCHER DANS MAKOLA PAY</button><iframe id="fG" src="about:blank"></iframe></div>
<div class="box" id="bW" style="display:none"><input id="qW" placeholder="Tape: RDC"><button onclick="pW()">CHERCHER DANS MAKOLA PAY</button><iframe id="fW" src="about:blank"></iframe></div>
<script>
function o(k){document.querySelectorAll('.box').forEach(x=>x.style.display='none');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('a'));document.getElementById('b'+k).style.display='block';document.getElementById('t'+k).classList.add('a');}
function pY(){let q=document.getElementById('qY').value||'musique congolaise';document.getElementById('fY').src='https://yewtu.be/search?q='+encodeURIComponent(q);}
function pG(){let q=document.getElementById('qG').value||'Lubumbashi';document.getElementById('fG').src='https://lite.duckduckgo.com/lite/?q='+encodeURIComponent(q);}
function pW(){let q=document.getElementById('qW').value||'RDC';document.getElementById('fW').src='https://fr.m.wikipedia.org/w/index.php?search='+encodeURIComponent(q);}
</script></body></html>
