<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKOLA SEARCH - Google | YouTube | Wikipedia</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f7;margin:0;padding:20px;text-align:center}
.logo{font-size:42px;font-weight:bold;margin-top:40px}
.logo span:nth-child(1){color:#4285F4}span:nth-child(2){color:#EA4335}span:nth-child(3){color:#FBBC05}span:nth-child(4){color:#4285F4}span:nth-child(5){color:#34A853}span:nth-child(6){color:#EA4335}
h1{color:#333;margin:10px}
.search-box{margin:30px auto;max-width:600px;background:white;padding:20px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
input{width:85%;padding:15px;font-size:18px;border:2px solid #ddd;border-radius:25px;outline:none}
input:focus{border-color:#4285F4}
.buttons{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{padding:12px 20px;border:none;border-radius:8px;font-size:16px;cursor:pointer;color:white;font-weight:bold}
.btn-g{background:#4285F4}.btn-y{background:#FF0000}.btn-w{background:#333}
button:hover{opacity:0.8;transform:scale(1.05)}
.footer{margin-top:60px;color:#888}
</style>
</head>
<body>
<div class="logo"><span>M</span><span>A</span><span>K</span><span>O</span><span>L</span><span>A</span></div>
<h1>Recherche Combinée</h1>
<p>Un seul endroit pour Google, YouTube et Wikipedia</p>

<div class="search-box">
<input type="text" id="q" placeholder="Tape ta recherche ici... ex: Lubumbashi" onkeypress="if(event.key==='Enter')search('g')">
<div class="buttons">
<button class="btn-g" onclick="search('g')">🔍 Google</button>
<button class="btn-y" onclick="search('y')">▶️ YouTube</button>
<button class="btn-w" onclick="search('w')">📚 Wikipedia</button>
</div>
</div>

<div class="footer">Créé par makola000 | MAKOLA SEARCH 2026</div>

<script>
function search(type){
let query=document.getElementById('q').value.trim();
if(!query){alert('Tape quelque chose d\'abord!');return;}
let url='';
if(type==='g') url='https://www.google.com/search?q='+encodeURIComponent(query);
if(type==='y') url='https://www.youtube.com/results?search_query='+encodeURIComponent(query);
if(type==='w') url='https://fr.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(query);
window.open(url,'_blank');
}
</script>
</body>
</html>
