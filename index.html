<body>
<div class="box">
<h2>MAKOLA PAY 500 FC</h2>

<button onclick="verif()">ACCÉDER SANS MÉGA</button>

</div>
<script>
function verif(){
 let c = document.getElementById('code').value.trim().toUpperCase();
 if(c==='MAKOLA0510'){
   document.getElementById('msg').innerText='✅ Code OK! Ouverture...';
   setTimeout(()=>{ window.location.href='./science.html'; }, 800);
 }else{
   document.getElementById('msg').innerText='❌ Code faux! Tu as tapé: '+c+' | Paye 500FC au 0820479539';
 }
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
