<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKOLA PAY</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#0000ff;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.tabs{display:flex;background:white}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;font-size:12px}
.tab.active{border-color:#0000ff;color:#0000ff;font-weight:bold}
.content{padding:15px}
.box{background:white;padding:15px;border-radius:10px}
input{width:100%;padding:12px;border:2px solid #0000ff;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0000ff;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold}
iframe{width:100%;height:60vh;border:none;margin-top:10px}
.price{font-size:24px;color:#0000ff;font-weight:bold;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="header">MAKOLA PAY</div>
<div class="tabs">
<div class="tab active" onclick="show('a',this)">YouTube</div>
<div class="tab" onclick="show('b',this)">Google</div>
<div class="tab" onclick="show('c',this)">Wiki</div>
<div class="tab" onclick="show('d',this)">Telecharger</div>
<div class="tab" onclick="show('e',this)">Dollar</div>
</div>
<div class="content">
<div id="a" class="box"><input id="i1" placeholder="Cherche YouTube"><button onclick="document.getElementById('r1').innerHTML='<iframe src=https://www.youtube.com/results?search_query='+encodeURIComponent(document.getElementById('i1').value)+'></iframe>'">Rechercher</button><div id="r1"></div></div>
<div id="b" class="box" style="display:none"><input id="i2" placeholder="Cherche Google"><button onclick="document.getElementById('r2').innerHTML='<iframe src=https://www.google.com/search?q='+encodeURIComponent(document.getElementById('i2').value)+'&igu=1></iframe>'">Rechercher</button><div id="r2"></div></div>
<div id="c" class="box" style="display:none"><input id="i3" placeholder="Cherche Wikipedia"><button onclick="document.getElementById('r3').innerHTML='<iframe src=https://fr.wikipedia.org/wiki/'+encodeURIComponent(document.getElementById('i3').value)+'></iframe>'">Rechercher</button><div id="r3"></div></div>
<div id="d" class="box" style="display:none"><h3>Telecharger YouTube</h3><input id="i4" placeholder="Colle lien youtube.com"><button onclick="let l=document.getElementById('i4').value;let id=l.split('v=')[1]?.split('&')[0]||l.split('/').pop();document.getElementById('r4').innerHTML='<a href=https://www.y2mate.com/youtube/'+id+' target=_blank><button>Ouvrir telechargement</button></a><iframe src=https://www.youtube.com/embed/'+id+'></iframe>'">Telecharger</button><div id="r4"></div></div>
<div id="e" class="box" style="display:none"><h3>1$ = 2800 FC</h3><input id="dol" type="number" placeholder="Montant en $" oninput="document.getElementById('fcRes').innerText=this.value*2800+' FC'"><div id="fcRes" class="price">0 FC</div><input id="fcc" type="number" placeholder="Montant en FC" style="margin-top:15px" oninput="document.getElementById('dolRes').innerText=(this.value/2800).toFixed(2)+' $'"><div id="dolRes" class="price">0 $</div></div>
</div>
<script>
function show(id,el){
document.querySelectorAll('.box').forEach(b=>b.style.display='none');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).style.display='block';
el.classList.add('active');
}
</script>
</body>
</html>
