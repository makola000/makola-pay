<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKOLA PAY</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white}
.header{background:#0000ff;color:white;padding:16px;text-align:center;font-size:22px;font-weight:bold}
.tabs{display:flex;background:#212121}
.tab{flex:1;padding:14px;text-align:center;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{border-color:#0000ff;color:#3ea6ff}
.content{padding:12px}
.box{background:#212121;padding:15px;border-radius:12px}
input{width:100%;padding:14px;border-radius:20px;border:1px solid #444;background:#121212;color:white;box-sizing:border-box}
button{width:100%;padding:12px;background:#0000ff;color:white;border:none;border-radius:20px;margin-top:10px;font-weight:bold}
.video-grid{display:grid;gap:10px;margin-top:15px}
.video-item{background:#000;border-radius:10px;overflow:hidden;cursor:pointer}
.video-item img{width:100%}
.video-item p{padding:8px;margin:0;font-size:14px}
iframe{width:100%;height:220px;border:none;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<div class="header">MAKOLA PAY ▶️</div>
<div class="tabs">
<div class="tab active" onclick="showTab('a',this)">YouTube Ici</div>
<div class="tab" onclick="showTab('b',this)">Google</div>
<div class="tab" onclick="showTab('c',this)">Wiki</div>
</div>
<div class="content">
<div id="a" class="box">
<input id="i1" placeholder="Tape: Fally Ipupa">
<button onclick="searchYT()">🔍 Rechercher et JOUER ICI</button>
<div id="player"></div>
<div id="r1" class="video-grid"></div>
</div>
<div id="b" class="box" style="display:none">
<input id="i2" placeholder="Recherche Google">
<button onclick="document.getElementById('r2').innerHTML='<iframe src=https://www.google.com/search?q='+encodeURIComponent(document.getElementById('i2').value)+'&igu=1 style=height:70vh></iframe>'">Rechercher</button>
<div id="r2"></div>
</div>
<div id="c" class="box" style="display:none">
<input id="i3" placeholder="Wikipédia">
<button onclick="document.getElementById('r3').innerHTML='<iframe src=https://fr.wikipedia.org/wiki/'+encodeURIComponent(document.getElementById('i3').value)+' style=height:70vh;background:white></iframe>'">Rechercher</button>
<div id="r3"></div>
</div>
</div>
<script>
function showTab(id,el){
document.querySelectorAll('.box').forEach(b=>b.style.display='none');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).style.display='block';
el.classList.add('active');
}
function searchYT(){
let q=document.getElementById('i1').value;
if(!q)return alert('Tape quelque chose');
let r=document.getElementById('r1');
r.innerHTML='Chargement...';
// On utilise une astuce pour jouer direct
document.getElementById('player').innerHTML='<iframe src="https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(q)+'" allowfullscreen></iframe><p style=text-align:center>▶️ Vidéo joue dans MAKOLA PAY, pas sur YouTube!</p>';
r.innerHTML='';
}
</script>
</body>
</html>
