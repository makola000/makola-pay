<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAKOLA B</title>
<style>
body{font-family:Arial;padding:10px;background:#f5f5f5}
input{width:100%;padding:16px;font-size:18px;border-radius:10px;border:2px solid #4285f4;box-sizing:border-box}
button{width:100%;padding:16px;background:#4285f4;color:white;border:none;border-radius:10px;font-size:18px;margin-top:10px}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
a{display:block;padding:14px;margin:8px 0;border-radius:8px;text-align:center;text-decoration:none;color:white;font-weight:bold}
.yt{background:#ff0000}
.gg{background:#4285f4}
.wk{background:#34a853}
</style>
</head>
<body>
<h2>MAKOLA SEARCH B</h2>
<input id="q" type="text" placeholder="Tape Astrologie, Biologie...">
<button onclick="chercher()">CHERCHER</button>
<div id="R"></div>

<script>
function chercher(){
var mot = document.getElementById('q').value.trim();
if(mot.length < 2){ alert("Tape au moins 2 lettres"); return; }
var YT = "https://www.youtube.com/results?search_query=" + encodeURIComponent(mot + " cours");
var GG = "https://www.google.com/search?q=" + encodeURIComponent(mot + " definition cours");
var WK = "https://fr.wikipedia.org/wiki/" + encodeURIComponent(mot);
var PDF = "https://www.google.com/search?q=" + encodeURIComponent(mot + " cours pdf");

var html = "";
html += "<div class=card><h3>Resultat pour: "+mot+"</h3></div>";
html += "<div class=card><h3>📺 YouTube</h3><a class=yt href='"+YT+"' target=_blank>OUVRIR YOUTUBE : "+mot+"</a><iframe width='100%' height='220' src='https://www.youtube.com/embed?listType=search&list="+encodeURIComponent(mot)+" cours' frameborder='0' allowfullscreen></iframe></div>";
html += "<div class=card><h3>🔍 Google</h3><a class=gg href='"+GG+"' target=_blank>VOIR GOOGLE : "+mot+"</a><a class=wk href='"+WK+"' target=_blank>VOIR WIKIPEDIA : "+mot+"</a><a class=gg href='"+PDF+"' target=_blank>VOIR PDF : "+mot+"</a></div>";

document.getElementById('R').innerHTML = html;
}
</script>
</body>
</html>
