<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA PAY</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white}
.top{background:blue;padding:15px;text-align:center}
.logo{font-size:28px;font-weight:bold}
.tabs{display:flex;background:#222;overflow-x:auto}
.tabs div{padding:12px 15px;text-align:center;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
.tabs div.active{border-bottom:3px solid blue;color:#00aaff;font-weight:bold;background:#000}
input{width:90%;padding:16px;margin:15px 5%;border-radius:12px;border:3px solid blue;font-size:18px;box-sizing:border-box;color:black}
button{width:90%;margin:0 5%;padding:16px;background:blue;color:white;border:none;border-radius:12px;font-size:18px;font-weight:bold}
.card{background:#1a1a1a;margin:10px;border-radius:12px;padding:10px}
iframe{width:100%;height:400px;border:none;border-radius:12px;background:white}
.btn{display:block;padding:15px;margin-top:10px;text-align:center;color:white;text-decoration:none;border-radius:10px;font-weight:bold}
</style>
</head><body>
<div class="top"><div class="logo">⭐ MAKOLA PAY</div>Kolwezi - Tout en un</div>
<input id="q" placeholder="Astrologie, Football...">
<button onclick="searchAll()">🔍 CHERCHER PARTOUT</button>
<div class="tabs">
<div id="t1" class="active" onclick="showTab(1)">YOUTUBE</div>
<div id="t2" onclick="showTab(2)">TIKTOK</div>
<div id="t3" onclick="showTab(3)">FACEBOOK</div>
<div id="t4" onclick="showTab(4)">GOOGLE</div>
<div id="t5" onclick="showTab(5)">WIKIPEDIA</div>
</div>
<div id="R"><div class=card>Tape un mot</div></div>
<script>
let currentQ="";
function showTab(n){
document.querySelectorAll('.tabs div').forEach(d=>d.classList.remove('active'));
document.getElementById('t'+n).classList.add('active');
if(currentQ) loadTab(n,currentQ);
}
function searchAll(){
let m=document.getElementById('q').value.trim();
if(!m)return alert("Tape un mot");
currentQ=m;
showTab(1);
}
async function loadTab(tab,q){
let R=document.getElementById('R');
if(tab==1){
R.innerHTML="<div class=card>Chargement YouTube...</div>";
try{
let r=await fetch("https://pipedapi.kavin.rocks/search?q="+encodeURIComponent(q));
let j=await r.json();
let v=j.items.filter(x=>x.type=="stream").slice(0,2);
let h="";
v.forEach(x=>{
let id=(x.url.split('v=')[1]||x.url.split('/').pop()).split('&')[0];
h+=`<div class=card><b>${x.title.substring(0,60)}</b><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen></iframe></div>`;
});
R.innerHTML=h;
}catch(e){R.innerHTML=`<div class=card><iframe src="https://www.youtube.com/embed?listType=search&list=${q}"></iframe></div>`;}
}
if(tab==2){
R.innerHTML=`<div class=card><b>TikTok: ${q}</b><div id=box2>Chargement...</div></div>`;
try{
let r=await fetch("https://www.tikwm.com/api/feed/search?keywords="+encodeURIComponent(q)+"&count=2");
let j=await r.json();
let h="";
j.data.videos.forEach(v=>{h+=`<iframe src="https://www.tiktok.com/embed/${v.video_id}" style="height:600px"></iframe>`;});
document.getElementById('box2').innerHTML=h;
}catch(e){document.getElementById('box2').innerHTML=`<iframe src="https://www.tiktok.com/search?q=${q}" style="height:600px;background:white"></iframe>`;}
}
if(tab==3){
R.innerHTML=`<div class=card><b>Facebook: ${q}</b><iframe src="https://www.facebook.com/watch/search/?q=${encodeURIComponent(q)}" style="height:600px;background:white"></iframe></div>`;
}
if(tab==4){
R.innerHTML=`<div class=card><b>Google: ${q}</b><iframe src="https://www.google.com/search?igu=1&q=${encodeURIComponent(q)}" style="height:600px;background:white"></iframe><a class=btn style="background:#4285f4" href="https://www.google.com/search?q=${q}" target=_blank>🔍 Ouvrir Google</a></div>`;
}
if(tab==5){
R.innerHTML=`<div class=card><b>Wikipedia: ${q}</b><iframe src="https://fr.wikipedia.org/wiki/${encodeURIComponent(q)}" style="height:600px;background:white"></iframe><a class=btn style="background:green" href="https://fr.wikipedia.org/wiki/${q}" target=_blank>📖 Ouvrir Wikipedia</a></div>`;
}
}
</script>
</body></html>
