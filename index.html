<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="google-site-verification" content="E9QJqtpR2Hxmd2QGEvR7-fa2tELh1SZRXCXreRIsheM" />
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makola Pay - Moteur de recherche scientifique</title>
<style>body{font-family:Arial;margin:0;background:#fff}header{padding:20px;text-align:center;border-bottom:1px solid #ddd}.logo{font-size:40px;font-weight:bold;color:#0a3d8f}span{color:#e91e63}.search{max-width:700px;margin:30px auto;display:flex;border:1px solid #ccc;border-radius:30px;overflow:hidden;padding:5px}.search input{flex:1;border:none;padding:15px;outline:none;font-size:18px}.search button{background:#0a3d8f;color:#fff;border:none;padding:0 30px;border-radius:25px;cursor:pointer}#results{max-width:800px;margin:auto;padding:20px}.video{margin-bottom:30px;border-bottom:1px solid #eee;padding-bottom:20px}iframe{width:100%;height:400px;border:none;border-radius:10px}</style>
</head>
<body>
<header><div class="logo">Makola <span>Pay</span></div><p>Moteur de recherche de tous les cours scientifiques du monde</p></header>
<div class="search"><input id="q" placeholder="Ex: cours chimie organique, théorème de Pythagore, ADN..." onkeypress="if(event.key==='Enter')doSearch()"><button onclick="doSearch()">🔍</button></div>
<div id="results"><p style="text-align:center;color:#888">Tape ta recherche comme sur Google. Exemple: "physique quantique"</p></div>
<script>
function doSearch(){
let query = document.getElementById('q').value;
if(!query) return;
document.getElementById('results').innerHTML = '<h3>Résultats pour: '+query+'</h3><div class="video"><h4>📹 Cours vidéo: '+query+'</h4><iframe src="https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(query+' cours')+'&rel=0" allowfullscreen></iframe><p>Lecture directe sur Makola Pay - Pas de redirection YouTube</p></div><div class="video"><h4>📄 Cours texte et PDF</h4><iframe src="https://www.bing.com/search?q='+encodeURIComponent(query+' cours scientifique pdf site:edu OR site:org')+'" style="height:600px"></iframe></div><p><b>Astuce:</b> Tu restes toujours sur Makola Pay!</p>';
}
</script>
</body>
</html>
