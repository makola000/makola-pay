<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA 300 Cours</title>
<style>body{font-family:Arial;background:#f0f2f5;padding:15px}#login{background:white;max-width:400px;margin:80px auto;padding:30px;border-radius:10px;text-align:center}#app{display:none;max-width:900px;margin:auto}.search{width:100%;padding:15px;font-size:18px;border-radius:8px;border:1px solid #ccc;margin:20px 0}.cours{background:white;padding:20px;border-radius:10px;margin-bottom:15px}.video{padding:8px;background:#e7f3ff;margin:3px 0;display:block;border-radius:5px;text-decoration:none}.pdf{padding:8px;background:#fff8e1;margin:3px 0;display:block;border-radius:5px;text-decoration:none;border:1px solid #ffe69c}</style>
</head><body>
<div id="login"><h2>MAKOLA PAY</h2><input id="codeInput" placeholder="MAKOLA0510"><br><br><button onclick="if(document.getElementById('codeInput').value.toUpperCase()=='MAKOLA0510'){localStorage.setItem('ok','1');location.reload()}else{alert('Code faux')}">ENTRER</button></div>
<div id="app"><h1>MAKOLA - 300 Cours</h1><input id="search" class="search" placeholder="Cherche: Astrologie, Biologie, Chimie..." onkeyup="filtrer()"><div id="liste"></div></div>
<script>
if(localStorage.getItem('ok')=='1'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';}
let noms=["Astrologie","Astronomie","Biologie Cellulaire","Chimie Générale","Physique Mécanique","Math Algèbre","Anatomie","Génétique","Botanique","Zoologie","Ecologie","Microbiologie","Biochimie","Géologie","Climatologie","Pharmacologie","Physiologie","Histologie"];
let cours=[];
for(let i=1;i<=300;i++){let n=i<=noms.length?noms[i-1]:"Cours Science "+i;cours.push({nom:n, def:"Définition complète de "+n+". Théories, formules et explications détaillées pour lire hors ligne. Si tu quittes le site, tu peux lire le PDF.", video:["Vidéo "+n+" - Partie 1","Vidéo "+n+" - Partie 2"], pdf:["PDF "+n+" - 50 pages - Définitions","PDF "+n+" - 100 pages - Formules"]});}
function htmlCard(c){return `<div class="cours"><h2>${c.nom}</h2><p><b>📖 Explication / Définition:</b><br>${c.def}</p><b>🎥 Vidéos de ${c.nom}:</b>${c.video.map(v=>`<a class="video" href="#">${v} ▶️</a>`).join('')}<b>📄 PDF de ${c.nom} (hors site):</b>${c.pdf.map(p=>`<a class="pdf" href="#">${p} ⬇️</a>`).join('')}</div>`;}
function afficher(list){document.getElementById('liste').innerHTML=list.map(c=>htmlCard(c)).join('');}
function filtrer(){let q=document.getElementById('search').value.toLowerCase();let f=q==""?cours:cours.filter(c=>c.nom.toLowerCase().includes(q));afficher(f);}
afficher(cours);
</script></body></html>
