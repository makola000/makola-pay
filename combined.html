<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKOLA Combined Search</title><style>body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:20px;text-align:center}h1{font-size:36px}.box{max-width:650px;margin:30px auto;background:#1e293b;padding:25px;border-radius:16px}input{width:90%;padding:16px;font-size:18px;border-radius:30px;border:none} .btns{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{padding:13px 22px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.g{background:white}.y{background:#ff0000;color:white}.w{background:#e2e8f0} a{color:#60a5fa}</style></head><body><h1>🔬 MAKOLA SCIENCE</h1><p>Google • YouTube • Wikipedia</p><div class="box"><input id="q" placeholder="Ex: photosynthèse..." onkeydown="if(event.key==='Enter')go('g')"><div class="btns"><button class="g" onclick="go('g')">🔍 Google</button><button class="y" onclick="go('y')">▶️ YouTube</button><button class="w" onclick="go('w')">📚 Wikipedia</button></div></div><p><a href="./">← Accueil</a></p><script>function go(t){let q=document.getElementById('q').value.trim();if(!q){alert('Tape recherche!');return;}let u=t==='g'?'https://www.google.com/search?q='+encodeURIComponent(q):t==='y'?'https://www.youtube.com/results?search_query='+encodeURIComponent(q):'https://fr.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(q);window.open(u,'_blank');}</script></body></html>
